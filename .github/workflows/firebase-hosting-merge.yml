name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main  # Asegúrate de que tu rama se llame 'main'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALTUM_STUDIO }}'
          channelId: live
          projectId: gen-lang-client-0244680885